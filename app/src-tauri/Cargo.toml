[package]
name = "aispice-app"
description = "The aispice desktop app: a thin Tauri shell over the aispice crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "aispice_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aispice-core.workspace = true
aispice-sim.workspace = true
aispice-agent.workspace = true
aispice-tools.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7"
async-trait = "0.1"
dirs.workspace = true
notify = "8.2.0"

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
