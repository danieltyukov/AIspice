<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- White rounded background -->
  <rect fill="#FFFFFF" width="512" height="512" rx="80"/>

  <g fill="#8B1A1A">
    <!--
      Stylized "AI" monogram inspired by the LTspice logo mark.
      Bold angular swoosh strokes suggesting circuit traces.
    -->

    <!-- "A" left stroke — bold diagonal swoosh from bottom-left to apex -->
    <path d="
      M 52,420
      L 220,80
      L 268,80
      L 100,420
      Z
    "/>

    <!-- "A" right stroke — bold diagonal from apex to bottom-right -->
    <path d="
      M 220,80
      L 268,80
      L 380,420
      L 332,420
      Z
    "/>

    <!-- "A" crossbar — extends right as a circuit trace to connect to "I" -->
    <rect x="120" y="290" width="340" height="38" rx="4"/>

    <!-- "A" counter (white triangle cutout above crossbar) -->
    <path d="M 182,290 L 244,155 L 306,290 Z" fill="#FFFFFF"/>

    <!-- "I" vertical stroke -->
    <rect x="410" y="80" width="48" height="340" rx="6"/>

    <!-- "I" top serif -->
    <rect x="390" y="80" width="88" height="32" rx="4"/>

    <!-- "I" bottom serif -->
    <rect x="390" y="388" width="88" height="32" rx="4"/>

    <!-- Circuit node dot at top of I -->
    <circle cx="434" cy="56" r="14"/>
  </g>
</svg>
